<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060B">
<title>FF SQUAD — Esports Performance Tracker</title>
<style>
:root{--bg:#05060B;--bg2:#080B17;--pur:#24104A;--cy:#42E8FF;--bl:#528BFF;--vi:#9B6CFF;--tx:#EDF4FF;--tx2:#8FA2C3;--bd:#1D2A45;--ok:#3DDC97;--er:#FF6B6B;--wa:#FFC857}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:radial-gradient(120% 55% at 50% 0,var(--pur),var(--bg) 62%) no-repeat,var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top)}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px}
.logo{font-size:28px;font-weight:800;letter-spacing:.12em;text-align:center;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);text-align:center;margin:4px 0 22px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px)}
label{display:block;color:var(--tx2);font-size:14px;margin-bottom:12px}
input,select{width:100%;min-height:48px;margin-top:6px;padding:10px 12px;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--cy);outline-offset:1px}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--cy),var(--bl));color:#05060B;font:700 16px system-ui;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--cy);border:1px solid var(--bd)}
.btn.sm{width:auto;padding:0 16px}
.links{display:flex;justify-content:space-between;margin-top:14px}
a{color:var(--cy);cursor:pointer;padding:8px 0}
.msg{font-size:14px;margin:0 0 10px}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:rgba(5,6,11,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header small{display:block;color:var(--tx2)}
.pill{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.connecting{color:var(--wa)}.pill.err,.pill.off{color:var(--er)}
main{max-width:600px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h2{margin:4px 0 12px}h3{margin-bottom:10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ov{margin:0}.ov b{display:block;margin-top:6px;font-size:15px}
small,.mut{color:var(--tx2)}
.pl{display:flex;gap:12px;align-items:center}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--vi),var(--bl))}
.fl{flex:1;min-width:0}.fl b,.fl span,.fl small{display:block;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row select{flex:1 1 140px;margin:0}.row .msg{flex-basis:100%;margin:0}
.code{font:800 28px ui-monospace,monospace;letter-spacing:.15em;color:var(--cy);margin-top:6px}
ul{list-style:none}li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}li small{white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(8,11,23,.92);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--tx2);font:12px system-ui}
nav button span{display:block;font-size:20px}nav button.on{color:var(--cy)}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<script>
// ===== CONFIG: public values only (never put a secret / service_role key here) =====
const CONFIG = {
  SUPABASE_URL: 'https://xaixnqvyoswcvvkydrmh.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_H10l8gZedy2FwkSP4XMyRQ_nbamdPES'
};
// ===================================================================================
const VERSION = '0.1 (Phase B)';
const ROLES = {1:'Primary Rusher',2:'Secondary Rusher',3:'Third Rusher / Flanker',4:'Sniper / IGL'};
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const LBL = {ok:'Synced',connecting:'Connecting…',off:'Offline',err:'Sync error'};
const app = document.getElementById('app');
const S = {view:'home', sync:'off', uid:null, me:null, team:null, members:[], names:{}, recovery:false, ch:null};
let sb = null, chKey = '', tm = 0;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bad = m => { throw {user:1, message:m}; };
const run = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
const fmt = d => new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short'});
const isOwner = () => !!S.me && S.me.membership_role === 'owner';
const say = (f, t, m) => { const e = f && f.querySelector('.msg'); if (e) { e.className = 'msg ' + t; e.textContent = m; } };
const pill = () => `<span id="sync" class="pill ${S.sync}">${LBL[S.sync]}</span>`;
function setSync(v){ S.sync = v; const e = document.getElementById('sync'); if (e) e.outerHTML = pill(); }

function friendly(e){
  if (e && e.user) return e.message;
  const m = String((e && e.message) || e);
  if (!navigator.onLine || /fetch|network/i.test(m)) return 'No internet connection. Please try again.';
  if (/Invalid login/i.test(m)) return 'Wrong email or password.';
  if (/already registered/i.test(m)) return 'This email already has an account.';
  if (/not confirmed/i.test(m)) return 'Please confirm your email first, then sign in.';
  if (/Invalid join code/i.test(m)) return 'Invalid join code. Ask the team owner for the right one.';
  if (/duplicate|unique/i.test(m)) return 'That player slot is already taken.';
  if (/Not allowed|row-level|permission/i.test(m)) return 'You do not have permission to do that.';
  return 'Something went wrong. Please try again.';
}

// ---------- screens ----------
function setupView(title, text){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Esports Performance Tracker</p>
  <div class="card"><h3>${esc(title)}</h3><p class="mut">${esc(text)}</p></div></div>`;
}
function authView(mode = 'login'){
  const t = {login:'Sign In', signup:'Create Account', forgot:'Send Reset Link'}[mode];
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Esports Performance Tracker</p>
  <div class="card"><form data-f="${mode}" novalidate>
  ${mode === 'signup' ? '<label>Display name<input name="name" maxlength="40" autocomplete="nickname"></label>' : ''}
  <label>Email<input name="email" type="email" inputmode="email" autocomplete="email"></label>
  ${mode !== 'forgot' ? `<label>Password<input name="pw" type="password" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}"></label>` : ''}
  ${mode === 'signup' ? '<label>Confirm password<input name="pw2" type="password" autocomplete="new-password"></label>' : ''}
  <div class="msg" role="alert"></div><button class="btn">${t}</button></form>
  <div class="links">${mode === 'login' ? '<a data-go="forgot">Forgot password?</a><a data-go="signup">Create account</a>' : '<a data-go="login">Back to sign in</a>'}</div></div></div>`;
}
function recoverView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Set a new password</p>
  <div class="card"><form data-f="recover" novalidate>
  <label>New password<input name="pw" type="password" autocomplete="new-password"></label>
  <label>Confirm password<input name="pw2" type="password" autocomplete="new-password"></label>
  <div class="msg" role="alert"></div><button class="btn">Save Password</button></form></div></div>`;
}
function onboardView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Welcome to FF SQUAD</p>
  <div class="card"><h3>Create New Team</h3><form data-f="createTeam" novalidate>
  <label>Team name<input name="name" maxlength="50"></label>
  <label>Team description (optional)<input name="desc" maxlength="200"></label>
  <p class="mut" style="margin-bottom:10px">Timezone: ${esc(TZ)}</p>
  <div class="msg" role="alert"></div><button class="btn">Create Team</button></form></div>
  <div class="card"><h3>Join Existing Team</h3><form data-f="joinTeam" novalidate>
  <label>Join code from your team owner<input name="code" maxlength="12" autocapitalize="characters" autocomplete="off"></label>
  <div class="msg" role="alert"></div><button class="btn ghost">Join Team</button></form></div>
  <div class="links"><a data-act="logout">Log out</a></div></div>`;
}
function waitView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Request sent</p>
  <div class="card"><h3>Waiting for approval</h3><p class="mut">The team owner must approve you and give you a player slot (P1–P4). This screen updates by itself.</p></div>
  <button class="btn ghost" data-act="reload">Check again</button>
  <div class="links"><a data-act="logout">Log out</a></div></div>`;
}
function errorView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">&nbsp;</p>
  <div class="card"><h3>Could not load your data</h3><p class="mut">${navigator.onLine ? 'The server did not answer. Please try again.' : 'You are offline.'}</p></div>
  <button class="btn" data-act="reload">Try again</button><div class="links"><a data-act="logout">Log out</a></div></div>`;
}
function mainView(){
  const v = S.view, nm = S.names[S.uid] ? S.names[S.uid].display_name : '';
  const body = v === 'team' ? teamHTML() : v === 'settings' ? settingsHTML() : homeHTML();
  const tabs = [['home','Home','🏠'],['team','Team','👥'],['settings','Settings','⚙️']];
  app.innerHTML = `<header><div><b>${esc(S.team.team_name)}</b><small>${esc(nm)} · ${esc(S.me.membership_role)}</small></div>${pill()}</header>
  <main>${body}</main><nav>${tabs.map(([k,l,i]) => `<button data-nav="${k}" class="${k === v ? 'on' : ''}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
}
function homeHTML(){
  const ov = ['Team Daily Score','Team Evaluation','Drill Completion','Scrim Performance']
    .map(t => `<div class="card ov"><small>${t}</small><b>No Data Available</b></div>`).join('');
  const cards = [1,2,3,4].map(n => {
    const m = S.members.find(x => x.player_number === n && x.status === 'active');
    const p = m && S.names[m.user_id], name = p ? p.display_name : 'Player';
    return `<div class="card pl"><div class="av">${m ? esc(name[0].toUpperCase()) : 'P' + n}</div>
    <div class="fl"><b>P${n} — ${ROLES[n]}</b><span>${m ? esc(name) : 'Player Not Connected'}</span>
    <small>${m ? 'Connected' : 'Waiting to join'} · No score yet</small></div></div>`;
  }).join('');
  const act = [{d:S.team.created_at, t:'Team created'}].concat(
    S.members.filter(m => m.user_id !== S.team.owner_id).map(m => ({d:m.joined_at,
      t:((S.names[m.user_id] || {}).display_name || 'A player') + (m.status === 'active' ? ' joined' : ' asked to join')})))
    .sort((a, b) => new Date(b.d) - new Date(a.d)).slice(0, 6)
    .map(a => `<li><span>${esc(a.t)}</span><small>${fmt(a.d)}</small></li>`).join('');
  return `<h2>Team Overview</h2><div class="grid">${ov}</div><h2>Squad</h2>${cards}
  <h2>Recent Activity</h2><div class="card"><ul>${act}</ul></div>`;
}
function teamHTML(){
  const used = new Set(S.members.filter(m => m.player_number).map(m => m.player_number));
  const free = [1,2,3,4].filter(n => !used.has(n));
  const nameOf = m => esc((S.names[m.user_id] || {}).display_name || 'Player');
  const row = m => `<form class="row" data-f="assign"><input type="hidden" name="id" value="${m.id}">
    <div class="fl"><b>${nameOf(m)}</b><small>${m.status === 'active' ? 'Active · no slot yet' : 'Waiting for approval'}</small></div>
    <select name="slot">${free.map(x => `<option value="${x}">P${x} ${ROLES[x]}</option>`).join('')}</select>
    <button class="btn sm" ${free.length ? '' : 'disabled'}>${m.status === 'active' ? 'Assign' : 'Approve'}</button><div class="msg"></div></form>`;
  const todo = S.members.filter(m => m.status !== 'active' || !m.player_number);
  const roster = S.members.filter(m => m.status === 'active').map(m =>
    `<li><span>${nameOf(m)}</span><small>${m.player_number ? 'P' + m.player_number + ' · ' + ROLES[m.player_number] : 'No slot'}</small></li>`).join('');
  const own = isOwner() ? `<div class="card"><small>Join code — share only with your players</small><div class="code">${esc(S.team.invite_code)}</div></div>
    <div class="card"><h3>Waiting for you</h3>${todo.length ? todo.map(row).join('') : '<p class="mut">No one is waiting.</p>'}</div>` : '';
  return `<h2>Team</h2>${own}<div class="card"><h3>Roster</h3><ul>${roster}</ul></div>`;
}
function settingsHTML(){
  const p = S.names[S.uid] || {};
  return `<h2>Settings</h2>
  <div class="card"><h3>Profile</h3><p>${esc(p.display_name || '')}</p><small>${esc(S.me.membership_role)}${S.me.player_number ? ' · P' + S.me.player_number + ' ' + ROLES[S.me.player_number] : ''}</small></div>
  <div class="card"><h3>Team</h3><p>${esc(S.team.team_name)}</p><small>${esc(S.team.team_description || 'No description')} · ${esc(S.team.timezone)}</small></div>
  <div class="card"><h3>Account</h3><small>${esc(S.email || '')}</small></div>
  <div class="card"><h3>Status</h3><small>Backend: configured · Realtime: ${LBL[S.sync]} · App version ${VERSION}</small></div>
  <button class="btn ghost" data-act="logout">Log out</button>`;
}

// ---------- data ----------
async function load(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if (!session){ S.uid = null; S.me = S.team = null; unsub(); return authView(); }
    S.uid = session.user.id; S.email = session.user.email;
    if (S.recovery) return recoverView();
    const [p, m] = await Promise.all([
      run(sb.from('profiles').select('*').eq('id', S.uid).maybeSingle()),
      run(sb.from('team_members').select('*').eq('user_id', S.uid))]);
    S.me = m.find(x => x.status === 'active') || m[0] || null; S.team = null;
    subscribe();
    if (!S.me) return onboardView();
    if (S.me.status !== 'active') return waitView();
    const tid = S.me.team_id;
    const [t, ms] = await Promise.all([
      run(sb.from('teams').select('*').eq('id', tid).single()),
      run(sb.from('team_members').select('*').eq('team_id', tid).order('joined_at'))]);
    const pr = await run(sb.from('profiles').select('id,display_name,avatar_url').in('id', [...new Set(ms.map(x => x.user_id))]));
    S.team = t; S.members = ms; S.names = Object.fromEntries(pr.map(x => [x.id, x]));
    mainView();
  }catch(e){ console.error(e); errorView(); }
}

// ---------- realtime (one channel only; always cleaned up) ----------
function unsub(){ if (S.ch){ sb.removeChannel(S.ch); S.ch = null; } chKey = ''; }
function refreshSoon(){ clearTimeout(tm); tm = setTimeout(load, 400); }
function subscribe(){
  const key = S.uid + '|' + (S.me ? S.me.team_id + S.me.status : '');
  if (key === chKey && S.ch) return;
  unsub(); chKey = key; setSync('connecting');
  const ch = sb.channel('ff-' + key);
  ch.on('postgres_changes', {event:'*', schema:'public', table:'team_members', filter:'user_id=eq.' + S.uid}, refreshSoon);
  if (S.me && S.me.status === 'active'){
    ch.on('postgres_changes', {event:'*', schema:'public', table:'team_members', filter:'team_id=eq.' + S.me.team_id}, refreshSoon);
    ch.on('postgres_changes', {event:'UPDATE', schema:'public', table:'profiles'}, refreshSoon);
  }
  S.ch = ch;
  ch.subscribe(st => { if (S.ch !== ch) return; setSync(st === 'SUBSCRIBED' ? 'ok' : st === 'CLOSED' ? 'off' : 'err'); });
}

// ---------- actions ----------
const H = {
  async login(d){
    if (!d.email.trim() || !d.pw) bad('Enter your email and password.');
    await run(sb.auth.signInWithPassword({email:d.email.trim(), password:d.pw}));
  },
  async signup(d, f){
    const em = d.email.trim(), nm = (d.name || '').trim();
    if (nm.length < 2) bad('Enter your display name (at least 2 letters).');
    if (!/^\S+@\S+\.\S+$/.test(em)) bad('Enter a valid email address.');
    if (d.pw.length < 8) bad('Password must be at least 8 characters.');
    if (d.pw !== d.pw2) bad('Passwords do not match.');
    const r = await run(sb.auth.signUp({email:em, password:d.pw, options:{data:{display_name:nm}}}));
    if (!r.session) say(f, 'ok', 'Account created. Check your email to confirm it, then sign in.');
  },
  async forgot(d, f){
    if (!/^\S+@\S+\.\S+$/.test(d.email.trim())) bad('Enter a valid email address.');
    await run(sb.auth.resetPasswordForEmail(d.email.trim(), {redirectTo: location.origin + location.pathname}));
    say(f, 'ok', 'If this email has an account, a reset link is on its way.');
  },
  async recover(d){
    if (d.pw.length < 8) bad('Password must be at least 8 characters.');
    if (d.pw !== d.pw2) bad('Passwords do not match.');
    await run(sb.auth.updateUser({password:d.pw}));
    S.recovery = false; history.replaceState(null, '', location.pathname); load();
  },
  async createTeam(d){
    if (d.name.trim().length < 2) bad('Enter a team name (at least 2 letters).');
    await run(sb.rpc('create_team', {p_name:d.name, p_description:d.desc, p_timezone:TZ}));
    await load();
  },
  async joinTeam(d){
    if (d.code.trim().length < 4) bad('Enter the join code.');
    await run(sb.rpc('join_team', {p_code:d.code}));
    await load();
  },
  async assign(d){
    await run(sb.rpc('assign_member', {p_member:d.id, p_player:Number(d.slot), p_activate:true}));
    await load();
  }
};
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, h = H[f.dataset.f];
  if (!h || f.dataset.busy) return;
  const btn = f.querySelector('.btn'); f.dataset.busy = 1; if (btn) btn.disabled = true; say(f, '', '');
  try{ await h(Object.fromEntries(new FormData(f)), f); }
  catch(err){ console.error(err); say(f, 'er', friendly(err)); }
  finally{ delete f.dataset.busy; if (btn) btn.disabled = false; }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-nav],[data-act]'); if (!t) return;
  if (t.dataset.go) return authView(t.dataset.go);
  if (t.dataset.nav){ S.view = t.dataset.nav; return mainView(); }
  if (t.dataset.act === 'reload') return load();
  if (t.dataset.act === 'logout'){ unsub(); try{ await sb.auth.signOut(); }catch(err){ console.error(err); } load(); }
});

// ---------- start ----------
async function boot(){
  if (!CONFIG.SUPABASE_URL.includes('.supabase.co') || CONFIG.SUPABASE_ANON_KEY.length < 20)
    return setupView('Backend Not Configured', 'Open the file, find CONFIG near the top of the script, and paste your Supabase URL and publishable key.');
  if (!window.supabase) return setupView('Could not load Supabase', 'Check your internet connection and reload the page.');
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const {data:{session}} = await sb.auth.getSession();
  S.uid = session ? session.user.id : null;
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'PASSWORD_RECOVERY'){ S.recovery = true; return recoverView(); }
    const id = ses && ses.user ? ses.user.id : null;
    if (ev === 'SIGNED_OUT' || id !== S.uid){ S.uid = id; setTimeout(load, 0); }
  });
  window.addEventListener('offline', () => setSync('off'));
  window.addEventListener('online', load);
  load();
}
boot();
</script>
</body>
</html>
