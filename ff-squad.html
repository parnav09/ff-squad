<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060B">
<title>FF SQUAD — Esports Performance Tracker</title>
<style>
:root{--bg:#05060B;--bg2:#080B17;--pur:#24104A;--cy:#42E8FF;--bl:#528BFF;--vi:#9B6CFF;--tx:#EDF4FF;--tx2:#8FA2C3;--bd:#1D2A45;--ok:#3DDC97;--er:#FF6B6B;--wa:#FFC857}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;background:radial-gradient(120% 55% at 50% 0,var(--pur),var(--bg) 62%) no-repeat,var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;overflow-x:hidden;padding-top:env(safe-area-inset-top)}
.wrap{max-width:480px;margin:0 auto;padding:28px 16px}
.logo{font-size:28px;font-weight:800;letter-spacing:.12em;text-align:center;background:linear-gradient(90deg,var(--cy),var(--vi));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);text-align:center;margin:4px 0 22px}
.card{background:rgba(255,255,255,.04);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;backdrop-filter:blur(10px)}
label{display:block;color:var(--tx2);font-size:14px;margin-bottom:12px}
input,select{width:100%;min-height:48px;margin-top:6px;padding:10px 12px;background:var(--bg2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;font:inherit}
input:focus,select:focus{outline:2px solid var(--cy);outline-offset:1px}
.btn{width:100%;min-height:48px;border:0;border-radius:12px;background:linear-gradient(90deg,var(--cy),var(--bl));color:#05060B;font:700 16px system-ui;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--cy);border:1px solid var(--bd)}
.btn.sm{width:auto;padding:0 16px}
.links{display:flex;justify-content:space-between;margin-top:14px}
a{color:var(--cy);cursor:pointer;padding:8px 0}
.msg{font-size:14px;margin:0 0 10px}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}
header{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;background:rgba(5,6,11,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
header small{display:block;color:var(--tx2)}
.pill{font-size:12px;padding:6px 10px;border-radius:99px;border:1px solid var(--bd);white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.connecting{color:var(--wa)}.pill.err,.pill.off{color:var(--er)}
main{max-width:600px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h2{margin:4px 0 12px}h3{margin-bottom:10px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.ov{margin:0}.ov b{display:block;margin-top:6px;font-size:15px}
small,.mut{color:var(--tx2)}
.pl{display:flex;gap:12px;align-items:center}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,var(--vi),var(--bl))}
.fl{flex:1;min-width:0}.fl b,.fl span,.fl small{display:block;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row select{flex:1 1 140px;margin:0}.row .msg{flex-basis:100%;margin:0}
.code{font:800 28px ui-monospace,monospace;letter-spacing:.15em;color:var(--cy);margin-top:6px}
ul{list-style:none}li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}li small{white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(8,11,23,.92);backdrop-filter:blur(14px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:56px;background:none;border:0;color:var(--tx2);font:12px system-ui}
nav button span{display:block;font-size:20px}nav button.on{color:var(--cy)}
.chip{display:inline-block;margin:0 0 14px;padding:8px 12px;border:1px solid var(--bd);border-radius:99px;background:rgba(66,232,255,.07);color:var(--cy)}
.chip small{color:var(--tx2)}
.tgt{display:block;margin-top:8px;padding:6px 10px;border-radius:10px;background:rgba(155,108,255,.14);font-size:13px;overflow-wrap:anywhere}
li small.note{white-space:normal}h2 small{font-size:12px;font-weight:400}
li.lg{align-items:flex-start}
.note{display:block;margin-top:6px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border-left:2px solid var(--vi);color:var(--tx);font-size:14px;overflow-wrap:anywhere}
.tg{display:flex;align-items:center;gap:12px}
.sw{flex:none;width:56px;height:34px;border-radius:99px;border:1px solid var(--bd);background:var(--bg2);position:relative;cursor:pointer}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--tx2);transition:transform .2s}
.sw.on{background:linear-gradient(90deg,var(--cy),var(--bl));border-color:transparent}
.sw.on::after{transform:translateX(22px);background:#05060B}
.more{display:block;width:100%;min-height:44px;margin-top:8px;background:none;border:1px dashed var(--bd);border-radius:12px;color:var(--cy);font:600 14px system-ui;cursor:pointer}
.ic{flex:none;background:none;border:0;font-size:18px;min-width:44px;min-height:44px;cursor:pointer}
.seg{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;color:var(--tx2);font:600 14px system-ui}
.seg button.on{background:linear-gradient(90deg,var(--cy),var(--bl));color:#05060B}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0"></script>
<script>
// ===== CONFIG: public values only (never put a secret / service_role key here) =====
const CONFIG = {
  SUPABASE_URL: 'https://xaixnqvyoswcvvkydrmh.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_H10l8gZedy2FwkSP4XMyRQ_nbamdPES'
};
// ===================================================================================
const VERSION = '12';
const ROLES = {1:'Primary Rusher',2:'Secondary Rusher',3:'Third Rusher / Flanker',4:'Sniper / IGL',5:'Substitute'};
const CATS = ['communication','coordination','decision_making','role_execution','map_awareness'];
const CAT_LBL = {communication:'Communication',coordination:'Coordination',decision_making:'Decision Making',role_execution:'Role Execution',map_awareness:'Map Awareness'};
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
const LBL = {ok:'Synced',connecting:'Connecting…',off:'Offline',err:'Sync error'};
const app = document.getElementById('app');
const S = {view:'home', sync:'off', uid:null, me:null, team:null, members:[], names:{}, scores:[], feedback:[], settings:{}, cmd:false, more:{}, nicks:{}, editNick:null, nickMode:null, introOpen:false, nickSeen:false, trSum:[], trRows:[], scoreTab:'player', tflash:'', ownLeave:false, ownArm:false, leaveArm:false, dirty:false, recovery:false, ch:null};
let sb = null, chKey = '', tm = 0;
// Read the reset-link result from the URL before Supabase clears it
const URLP = new URLSearchParams(location.hash.slice(1));
const LINK_ERR = URLP.get('error_description') || URLP.get('error') || '';
const LINK_RECOVERY = URLP.get('type') === 'recovery';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bad = m => { throw {user:1, message:m}; };
const run = async p => { const r = await p; if (r.error) throw r.error; return r.data; };
const fmt = d => new Date(d).toLocaleDateString(undefined, {day:'numeric', month:'short'});
const isOwner = () => !!S.me && S.me.membership_role === 'owner';
const cmdOn = () => isOwner() && S.cmd;   // owner tools only appear when Command Mode is ON
const say = (f, t, m) => { const e = f && f.querySelector('.msg'); if (e) { e.className = 'msg ' + t; e.textContent = m; } };
const pill = () => `<span id="sync" class="pill ${S.sync}">${LBL[S.sync]}</span>`;
function setSync(v){ S.sync = v; const e = document.getElementById('sync'); if (e) e.outerHTML = pill(); }

function friendly(e){
  if (e && e.user) return e.message;
  const m = String((e && e.message) || e);
  if (!navigator.onLine || /fetch|network/i.test(m)) return 'No internet connection. Please try again.';
  if (/Invalid login/i.test(m)) return 'Wrong email or password.';
  if (/already registered/i.test(m)) return 'This email already has an account.';
  if (/not confirmed/i.test(m)) return 'Please confirm your email first, then sign in.';
  if (/Invalid join code/i.test(m)) return 'Invalid join code. Ask the team owner for the right one.';
  if (/duplicate|unique/i.test(m)) return 'That player slot is already taken.';
  if (/Not allowed|row-level|permission/i.test(m)) return 'You do not have permission to do that.';
  if (/new owner/i.test(m)) return 'Choose a player to become the new owner.';
  if (/Name already used/i.test(m)) return 'A player with this name is already in the team. Add your surname or a nickname.';
  if (/Name must be/i.test(m)) return 'Name must be 2 to 40 characters.';
  return 'Something went wrong. Please try again.';
}

// ---------- screens ----------
function setupView(title, text){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Esports Performance Tracker</p>
  <div class="card"><h3>${esc(title)}</h3><p class="mut">${esc(text)}</p></div></div>`;
}
function authView(mode = 'login'){
  const t = {login:'Sign In', signup:'Create Account', forgot:'Send Reset Link'}[mode];
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Esports Performance Tracker</p>
  <div class="card"><form data-f="${mode}" novalidate>
  ${mode === 'signup' ? '<label>Display name<input name="name" maxlength="40" autocomplete="nickname"></label>' : ''}
  <label>Email<input name="email" type="email" inputmode="email" autocomplete="email"></label>
  ${mode !== 'forgot' ? `<label>Password<input name="pw" type="password" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}"></label>` : ''}
  ${mode === 'signup' ? '<label>Confirm password<input name="pw2" type="password" autocomplete="new-password"></label>' : ''}
  <div class="msg" role="alert"></div><button class="btn">${t}</button></form>
  <div class="links">${mode === 'login' ? '<a data-go="forgot">Forgot password?</a><a data-go="signup">Create account</a>' : '<a data-go="login">Back to sign in</a>'}</div></div></div>`;
}
function recoverView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Set a new password</p>
  <div class="card"><form data-f="recover" novalidate>
  <label>New password<input name="pw" type="password" autocomplete="new-password"></label>
  <label>Confirm password<input name="pw2" type="password" autocomplete="new-password"></label>
  <div class="msg" role="alert"></div><button class="btn">Save Password</button></form></div></div>`;
}
function onboardView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Welcome to FF SQUAD</p>
  <div class="card"><h3>Create New Team</h3><form data-f="createTeam" novalidate>
  <label>Team name<input name="name" maxlength="50"></label>
  <label>Team description (optional)<input name="desc" maxlength="200"></label>
  <p class="mut" style="margin-bottom:10px">Timezone: ${esc(TZ)}</p>
  <div class="msg" role="alert"></div><button class="btn">Create Team</button></form></div>
  <div class="card"><h3>Join Existing Team</h3><form data-f="joinTeam" novalidate>
  <label>Your name in this team (only if asked)<input name="name" maxlength="40" autocomplete="nickname"></label>
  <label>Join code from your team owner<input name="code" maxlength="12" autocapitalize="characters" autocomplete="off"></label>
  <div class="msg" role="alert"></div><button class="btn ghost">Join Team</button></form></div>
  <div class="links"><a data-act="logout">Log out</a></div></div>`;
}
function waitView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">Request sent</p>
  <div class="card"><h3>Waiting for approval</h3><p class="mut">The team owner must approve you and give you a player slot (P1–P4). This screen updates by itself.</p></div>
  <button class="btn ghost" data-act="reload">Check again</button>
  <div class="links"><a data-act="logout">Log out</a></div></div>`;
}
function errorView(){
  app.innerHTML = `<div class="wrap"><div class="logo">FF SQUAD</div><p class="sub">&nbsp;</p>
  <div class="card"><h3>Could not load your data</h3><p class="mut">${navigator.onLine ? 'The server did not answer. Please try again.' : 'You are offline.'}</p></div>
  <button class="btn" data-act="reload">Try again</button><div class="links"><a data-act="logout">Log out</a></div></div>`;
}
function mainView(){
  const v = S.view, nm = S.names[S.uid] ? S.names[S.uid].display_name : '';
  const body = v === 'team' ? teamHTML() : v === 'settings' ? settingsHTML() : v === 'score' ? scoreTabsHTML() + (S.scoreTab === 'team' ? teamRatingHTML() : scoreHTML()) : homeHTML();
  const tabs = [['home','Home','🏠'],['score','Score','📝'],['team','Team' + (needsNick() ? ' •' : ''),'👥'],['settings','Settings' + (cmdOn() && missingFor(prevDay(today())).some(x => x.done < x.need) ? ' 🔴' : ''),'⚙️']];
  app.innerHTML = `<header><div><b>${esc(S.team.team_name)}</b><small>${esc(nm)} · ${isOwner() ? (S.cmd ? 'owner ⚡' : 'player') : esc(S.me.membership_role)}</small></div>${pill()}</header>
  <main>${body}</main><nav>${tabs.map(([k,l,i]) => `<button data-nav="${k}" class="${k === v ? 'on' : ''}"><span>${i}</span>${l}</button>`).join('')}</nav>`;
  if (v === 'score'){ prefillScore(); prefillTeam(); }
}
function homeHTML(){
  const td = teamDay();
  const ov = [['Team Daily Score', td ? td.avg.toFixed(1) + ' / 50 · ' + td.n + '/4 players · ' + fmtDay(td.date) : 'No Data Available'],
    ['Team Evaluation', teamEvalText()],['Drill Completion','No Data Available'],['Scrim Performance','No Data Available']]
    .map(([t, v]) => `<div class="card ov"><small>${t}</small><b>${v}</b></div>`).join('');
  const cards = [1,2,3,4].concat(S.settings.fifth_player === true ? [5] : []).map(n => {
    const m = S.members.find(x => x.player_number === n && x.status === 'active');
    const p = m && S.names[m.user_id], name = p ? p.display_name : 'Player';
    return `<div class="card pl"><div class="av">${m ? esc(name[0].toUpperCase()) : 'P' + n}</div>
    <div class="fl"><b>P${n} — ${ROLES[n]}</b><span>${m ? esc(name) : 'Player Not Connected'}</span>
    <small>${m ? 'Connected · ' + scoreLine(m.user_id) : 'Waiting to join · No score yet'}</small>${m ? tgtChip(m.user_id) : ''}</div></div>`;
  }).join('');
  const act = [{d:S.team.created_at, t:'Team created'}].concat(
    S.members.filter(m => m.user_id !== S.team.owner_id).map(m => ({d:m.joined_at,
      t:((S.names[m.user_id] || {}).display_name || 'A player') + (m.status === 'active' ? ' joined' : ' asked to join')})))
    .sort((a, b) => new Date(b.d) - new Date(a.d)).slice(0, 6)
    .map(a => `<li><span>${esc(a.t)}</span><small>${fmt(a.d)}</small></li>`).join('');
  return `<h2>Team Overview</h2><div class="grid">${ov}</div><h2>Squad</h2>${cards}
  <h2>Recent Activity</h2><div class="card"><ul>${act}</ul></div>`;
}
function teamHTML(){
  const fifth = S.settings.fifth_player === true;
  const used = new Set(S.members.filter(m => m.player_number).map(m => m.player_number));
  const free = [1,2,3,4].concat(fifth ? [5] : []).filter(n => !used.has(n));
  const nameOf = m => esc((S.names[m.user_id] || {}).display_name || 'Player');
  const row = m => `<form class="row" data-f="assign"><input type="hidden" name="id" value="${m.id}">
    <div class="fl"><b>${nameOf(m)}</b><small>${m.status === 'active' ? 'Active · no slot yet' : 'Waiting for approval'}</small></div>
    <select name="slot">${free.map(x => `<option value="${x}">P${x} ${ROLES[x]}</option>`).join('')}</select>
    <button class="btn sm" ${free.length ? '' : 'disabled'}>${m.status === 'active' ? 'Assign' : 'Approve'}</button><div class="msg"></div></form>`;
  const todo = S.members.filter(m => m.status !== 'active' || !m.player_number);
  const roster = S.members.filter(m => m.status === 'active').map(m => {
    const mine = m.user_id === S.uid, nk = S.nicks[m.user_id];
    const edit = S.editNick === m.user_id ? `<li class="lg" style="display:block"><form class="row" data-f="nick" style="border:0;padding:0"><input type="hidden" name="target" value="${m.user_id}"><input name="nick" maxlength="24" placeholder="Your private nickname" value="${esc(nk || '')}" style="flex:1 1 160px;margin:0"><button class="btn sm">Save</button><div class="msg"></div></form></li>` : '';
    return `<li class="lg"><div class="fl"><b>${nameOf(m)}${mine ? ' (you)' : ''}</b>${nk ? `<small>Your nickname: ${esc(nk)}</small>` : ''}<small>${m.player_number ? 'P' + m.player_number + ' · ' + ROLES[m.player_number] : 'No slot'}</small></div>${mine ? '' : `<button class="ic" data-nick="${m.user_id}" aria-label="Set nickname">✏️</button>`}</li>${edit}`;
  }).join('');
  const others = S.members.filter(m => m.status === 'active' && m.user_id !== S.uid);
  const tf = S.tflash ? `<p class="msg ok">${esc(S.tflash)}</p>` : ''; S.tflash = '';
  let nickBlock = '';
  if (others.length){
    const intro = S.introOpen || !nickDone();   // the big card is shown once: remembered as soon as it is first seen
    if (intro){ S.introOpen = true; setNickDone(); }
    if (S.nickMode === 'all') nickBlock = `<div class="card"><h3>✏️ Your private nicknames</h3><small>Only you can see these. Scoreboards always show original names. Leave a box empty to skip that player.</small>
      <form data-f="nickall" novalidate style="margin-top:12px">${others.map(m => `<label>${nameOf(m)} · ${m.player_number ? 'P' + m.player_number : 'no slot'}<input name="n_${m.user_id}" maxlength="24" value="${esc(S.nicks[m.user_id] || '')}"></label>`).join('')}
      <div class="msg" role="alert"></div><button class="btn">Save nicknames</button></form>
      <button class="btn ghost" style="margin-top:10px" data-act="nick-cancel">Cancel</button></div>`;
    else if (intro) nickBlock = `<div class="card"><h3>👋 Name your teammates? (optional)</h3><p class="mut" style="margin-bottom:12px">Save a private nickname for each teammate, like contacts on your phone. Only you can see them, and scoreboards still show original names.</p>
      <button class="btn" data-act="nick-open">Set nicknames</button><button class="btn ghost" style="margin-top:10px" data-act="nick-skip">Not now — I don't want nicknames</button></div>`;
    else nickBlock = '';
  }
  const sub = fifth
    ? `<div class="card"><h3>Fifth player · Substitute (P5)</h3><p class="mut" style="margin-bottom:10px">P5 is ON. Ask the player to sign up and join with the code above. They appear in "Waiting for you" and the P5 slot is picked automatically.</p>${used.has(5) ? '' : '<button class="btn ghost" data-act="fifth-off">Turn off P5</button>'}</div>`
    : `<div class="card"><h3>Fifth player (optional)</h3><p class="mut" style="margin-bottom:10px">One substitute (P5) for days when a main player is unavailable. Maximum 5 players.</p><button class="btn" data-act="fifth-on">+ Add fifth player</button></div>`;
  const own = cmdOn() ? `<div class="card"><small>Join code — share only with your players</small><div class="code">${esc(S.team.invite_code)}</div></div>
    ${todo.length ? `<div class="card"><h3>Waiting for you</h3>${todo.map(row).join('')}</div>` : ''}${sub}` : '';
  return `<h2>Team</h2>${tf}${own}${nickBlock}<div class="card"><div class="tg"><h3 style="margin:0;flex:1">Roster</h3>${others.length ? '<button class="ic" data-act="nick-open" aria-label="Edit nicknames">✏️</button>' : ''}</div><ul>${roster}</ul></div>`;
}
function settingsHTML(){
  const p = S.names[S.uid] || {};
  const cmd = isOwner() ? `<div class="card"><div class="tg"><div class="fl"><b>⚡ Command Mode</b><small>Owner tools: join code, approvals, fifth player, all ratings, daily check. OFF = you use the app like a normal player.</small></div><button class="sw ${S.cmd ? 'on' : ''}" data-act="cmd" aria-label="Command Mode"></button></div></div>` : '';
  const leave = leaveHTML();
  return `<h2>Settings</h2>${cmd}${cmdOn() ? checkHTML() + backupHTML() : ''}
  <div class="card"><h3>Profile</h3><p>${esc(p.display_name || '')}</p><small>${isOwner() && !S.cmd ? 'player' : esc(S.me.membership_role)}${S.me.player_number ? ' · P' + S.me.player_number + ' ' + ROLES[S.me.player_number] : ''}</small></div>
  <div class="card"><h3>Team</h3><p>${esc(S.team.team_name)}</p><small>${esc(S.team.team_description || 'No description')} · ${esc(S.team.timezone)}</small></div>
  <div class="card"><h3>Your name</h3><form data-f="rename" novalidate><label>Name shown on scoreboards<input name="name" maxlength="40" value="${esc(p.display_name || '')}"></label>
  <div class="msg" role="alert"></div><button class="btn ghost">Save name</button></form>
  <small style="display:block;margin-top:10px">If another player already uses this name, add your surname or a nickname.</small></div>
  <div class="card"><h3>Account</h3><small>${esc(S.email || '')}</small></div>
  <div class="card"><h3>Status</h3><small>Backend: configured · Realtime: ${LBL[S.sync]} · Version ${VERSION}</small></div>
  <button class="btn ghost" data-act="logout">Log out</button>${leave}`;
}

// ---------- data ----------
async function load(){
  try{
    const {data:{session}} = await sb.auth.getSession();
    if (!session){ S.uid = null; S.me = S.team = null; unsub(); authView(); if (S.linkMsg){ say(app.querySelector('form'), 'er', S.linkMsg); S.linkMsg = ''; } return; }
    S.uid = session.user.id; S.email = session.user.email;
    S.nickSeen = !!(session.user.user_metadata || {}).nick_intro;   // remembered on the account, so every phone knows
    if (S.recovery) return recoverView();
    const [p, m] = await Promise.all([
      run(sb.from('profiles').select('*').eq('id', S.uid).maybeSingle()),
      run(sb.from('team_members').select('*').eq('user_id', S.uid))]);
    S.me = m.find(x => x.status === 'active') || m[0] || null; S.team = null;
    subscribe();
    if (!S.me) return onboardView();
    if (S.me.status !== 'active') return waitView();
    const tid = S.me.team_id;
    const [t, ms] = await Promise.all([
      run(sb.from('teams').select('*').eq('id', tid).single()),
      run(sb.from('team_members').select('*').eq('team_id', tid).order('joined_at'))]);
    const pr = await run(sb.from('profiles').select('id,display_name,avatar_url').in('id', [...new Set(ms.map(x => x.user_id))]));
    const since = new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10);
    S.scores = await run(sb.from('daily_scores').select('*').eq('team_id', tid).gte('score_date', since).order('score_date', {ascending:false}));
    const [sm, fb, st, nk, trs, trr] = await Promise.all([
      run(sb.rpc('daily_summary', {p_team:tid, p_since:since})),
      run(sb.rpc('my_feedback', {p_team:tid, p_since:since})),
      run(sb.from('team_settings').select('*').eq('team_id', tid)),
      run(sb.from('player_nicknames').select('target_id,nickname').eq('viewer_id', S.uid)).catch(() => []),
      run(sb.rpc('team_rating_summary', {p_team:tid, p_since:since})).catch(() => []),
      run(sb.from('team_ratings').select('*').eq('team_id', tid).gte('week_start', since).order('week_start', {ascending:false}).order('updated_at', {ascending:false})).catch(() => [])]);
    const seen = {};
    S.ov = {days: sm.slice().sort((a, b) => b.score_date.localeCompare(a.score_date)).map(r => ({player_id:r.player_id, score_date:r.score_date, n:r.n, avg:r.avg_total})),
      targets: sm.slice().sort((a, b) => b.score_date.localeCompare(a.score_date))
        .filter(r => r.goal && !seen[r.player_id] && (seen[r.player_id] = 1)).map(r => ({player_id:r.player_id, target:r.goal}))};
    S.feedback = fb; S.settings = Object.fromEntries(st.map(x => [x.setting_key, x.setting_value]));
    S.nicks = Object.fromEntries(nk.map(x => [x.target_id, x.nickname]));
    S.trSum = trs; S.trRows = trr;
    S.team = t; S.members = ms; S.names = Object.fromEntries(pr.map(x => [x.id, x]));
    if (S.view === 'score' && S.dirty) return;   // do not wipe a half-filled form
    mainView();
    purgeOld();
  }catch(e){ console.error(e); errorView(); }
}

// ---------- realtime (one channel only; always cleaned up) ----------
function unsub(){ if (S.ch){ sb.removeChannel(S.ch); S.ch = null; } chKey = ''; }
function refreshSoon(){ clearTimeout(tm); tm = setTimeout(load, 400); }
function subscribe(){
  const key = S.uid + '|' + (S.me ? S.me.team_id + S.me.status : '');
  if (key === chKey && S.ch) return;
  unsub(); chKey = key; setSync('connecting');
  const ch = sb.channel('ff-' + key);
  ch.on('postgres_changes', {event:'*', schema:'public', table:'team_members', filter:'user_id=eq.' + S.uid}, refreshSoon);
  if (S.me && S.me.status === 'active'){
    ch.on('postgres_changes', {event:'*', schema:'public', table:'team_members', filter:'team_id=eq.' + S.me.team_id}, refreshSoon);
    ch.on('postgres_changes', {event:'UPDATE', schema:'public', table:'profiles'}, refreshSoon);
    ch.on('postgres_changes', {event:'*', schema:'public', table:'daily_scores', filter:'team_id=eq.' + S.me.team_id}, refreshSoon);
    ch.on('postgres_changes', {event:'*', schema:'public', table:'team_settings', filter:'team_id=eq.' + S.me.team_id}, refreshSoon);
    ch.on('postgres_changes', {event:'*', schema:'public', table:'team_ratings', filter:'team_id=eq.' + S.me.team_id}, refreshSoon);
    ch.on('postgres_changes', {event:'*', schema:'public', table:'score_pings', filter:'team_id=eq.' + S.me.team_id}, refreshSoon);
  }
  S.ch = ch;
  ch.subscribe(st => { if (S.ch !== ch) return; setSync(st === 'SUBSCRIBED' ? 'ok' : st === 'CLOSED' ? 'off' : 'err'); });
}

// ---------- actions ----------
const H = {
  async login(d){
    if (!d.email.trim() || !d.pw) bad('Enter your email and password.');
    await run(sb.auth.signInWithPassword({email:d.email.trim(), password:d.pw}));
  },
  async signup(d, f){
    const em = d.email.trim(), nm = (d.name || '').trim();
    if (nm.length < 2) bad('Enter your display name (at least 2 letters).');
    if (!/^\S+@\S+\.\S+$/.test(em)) bad('Enter a valid email address.');
    if (d.pw.length < 8) bad('Password must be at least 8 characters.');
    if (d.pw !== d.pw2) bad('Passwords do not match.');
    const r = await run(sb.auth.signUp({email:em, password:d.pw, options:{data:{display_name:nm}}}));
    if (!r.session) say(f, 'ok', 'Account created. Check your email to confirm it, then sign in.');
  },
  async forgot(d, f){
    if (!/^\S+@\S+\.\S+$/.test(d.email.trim())) bad('Enter a valid email address.');
    await run(sb.auth.resetPasswordForEmail(d.email.trim(), {redirectTo: location.origin + location.pathname}));
    say(f, 'ok', 'If this email has an account, a reset link is on its way.');
  },
  async recover(d){
    if (d.pw.length < 8) bad('Password must be at least 8 characters.');
    if (d.pw !== d.pw2) bad('Passwords do not match.');
    await run(sb.auth.updateUser({password:d.pw}));
    S.recovery = false; history.replaceState(null, '', location.pathname); load();
  },
  async createTeam(d){
    if (d.name.trim().length < 2) bad('Enter a team name (at least 2 letters).');
    await run(sb.rpc('create_team', {p_name:d.name, p_description:d.desc, p_timezone:TZ}));
    await load();
  },
  async joinTeam(d){
    if (d.code.trim().length < 4) bad('Enter the join code.');
    if ((d.name || '').trim()) await run(sb.rpc('set_display_name', {p_name:d.name}));
    await run(sb.rpc('join_team', {p_code:d.code}));
    await load();
  },
  async saveScore(d){
    if (!d.player) bad('Choose a player.');
    if (!d.date || d.date > today()) bad('Choose a valid date (not in the future).');
    const vals = {}; let filled = 0;
    CATS.forEach(k => { if (d[k] !== '') { vals[k] = Number(d[k]); filled++; } else vals[k] = null; });
    if (!filled) bad('Fill at least one category.');
    const row = Object.assign({team_id:S.team.id, score_date:d.date, player_id:d.player, evaluator_id:S.uid,
      notes:d.notes.trim() || null, improvement_target:d.goal.trim() || null}, vals);
    await run(sb.from('daily_scores').upsert(row, {onConflict:'team_id,score_date,player_id,evaluator_id'}));
    S.dirty = false; S.flash = filled === 5 ? 'Rating saved ✓' : 'Saved as Incomplete (' + filled + ' of 5 filled)';
    await load();
  },
  async rename(d){
    await run(sb.rpc('set_display_name', {p_name:d.name}));
    await load();
  },
  async nickall(d){   // save every nickname at once; empty box = no nickname
    const rows = [], clear = [];
    Object.keys(d).filter(k => k.startsWith('n_')).forEach(k => { const id = k.slice(2), v = (d[k] || '').trim(); if (v) rows.push({team_id:S.team.id, viewer_id:S.uid, target_id:id, nickname:v}); else clear.push(id); });
    if (rows.length) await run(sb.from('player_nicknames').upsert(rows, {onConflict:'viewer_id,target_id'}));
    if (clear.length) await run(sb.from('player_nicknames').delete().eq('viewer_id', S.uid).in('target_id', clear));
    setNickDone(); S.introOpen = false; S.nickMode = null; S.tflash = rows.length ? 'Nicknames saved ✓' : 'Saved. No nicknames set.'; await load();
  },
  async nick(d){   // private nickname: only the person who saves it can see it
    const v = d.nick.trim();
    if (v) await run(sb.from('player_nicknames').upsert({team_id:S.team.id, viewer_id:S.uid, target_id:d.target, nickname:v}, {onConflict:'viewer_id,target_id'}));
    else await run(sb.from('player_nicknames').delete().eq('viewer_id', S.uid).eq('target_id', d.target));
    S.editNick = null; setNickDone(); S.introOpen = false; await load();
  },
  async saveTeamRating(d){
    const vals = {}; let filled = 0;
    TCATS.forEach(([k]) => { if (d[k] !== '') { vals[k] = Number(d[k]); filled++; } else vals[k] = null; });
    if (!filled) bad('Fill at least one category.');
    const row = Object.assign({team_id:S.team.id, week_start:weekStart(today()), evaluator_id:S.uid,
      notes_worked:d.worked.trim() || null, notes_wrong:d.wrong.trim() || null, next_focus:d.focus.trim() || null}, vals);
    await run(sb.from('team_ratings').upsert(row, {onConflict:'team_id,week_start,evaluator_id'}));
    S.dirty = false; S.flash = filled === 9 ? 'Team rating saved ✓' : 'Saved as Incomplete (' + filled + ' of 9 filled)';
    await load();
  },
  async assign(d){
    await run(sb.rpc('assign_member', {p_member:d.id, p_player:Number(d.slot), p_activate:true}));
    await load();
  }
};
document.addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, h = H[f.dataset.f];
  if (!h || f.dataset.busy) return;
  const btn = f.querySelector('.btn'); f.dataset.busy = 1; if (btn) btn.disabled = true; say(f, '', '');
  try{ await h(Object.fromEntries(new FormData(f)), f); }
  catch(err){ console.error(err); say(f, 'er', friendly(err)); }
  finally{ delete f.dataset.busy; if (btn) btn.disabled = false; }

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-go],[data-nav],[data-act],[data-more],[data-nick]'); if (!t) return;
  if (t.dataset.go) return authView(t.dataset.go);
  if (t.dataset.more){ S.more[t.dataset.more] = !S.more[t.dataset.more]; return mainView(); }
  if (t.dataset.nick){ S.editNick = S.editNick === t.dataset.nick ? null : t.dataset.nick; return mainView(); }
  if (t.dataset.nav){ S.view = t.dataset.nav; S.introOpen = false; S.dirty = false; S.introOpen = false; return mainView(); }
  if (t.dataset.act === 'reload') return load();
  if (t.dataset.act === 'stab'){ S.scoreTab = t.dataset.k; S.dirty = false; return mainView(); }
  if (t.dataset.act === 'nick-open' || t.dataset.act === 'nick-cancel'){ S.nickMode = t.dataset.act === 'nick-open' ? 'all' : null; S.introOpen = false; return mainView(); }
  if (t.dataset.act === 'nick-skip'){ setNickDone(); S.introOpen = false; S.tflash = 'No problem. You can add nicknames anytime with Edit.'; return mainView(); }
  if (t.dataset.act === 'own-ask' || t.dataset.act === 'own-cancel'){ S.ownLeave = t.dataset.act === 'own-ask'; S.ownArm = false; return mainView(); }
  if (t.dataset.act === 'own-do'){
    const others = S.members.filter(m => m.user_id !== S.uid && m.status === 'active');
    if (!others.length && !S.ownArm){   // deleting the team: first tap only arms the button
      S.ownArm = true; mainView();
      setTimeout(() => { if (S.ownArm){ S.ownArm = false; if (S.view === 'settings' && S.team) mainView(); } }, 5000);
      return;
    }
    S.ownArm = false; t.disabled = true;
    const sel = document.getElementById('new-owner');
    try{ await run(sb.rpc('leave_team', {p_new_owner: others.length && sel ? sel.value : null})); S.ownLeave = false; S.view = 'home'; await load(); }
    catch(err){ console.error(err); t.disabled = false; bkSay(friendly(err), 'er'); }
    return;
  }
  if (t.dataset.act === 'bk-dl') return downloadBackup();
  if (t.dataset.act === 'bk-pick'){ const f = document.getElementById('bk-file'); if (f) f.click(); return; }
  if (t.dataset.act === 'leave'){
    if (!S.leaveArm){   // first tap only arms the button (no popup); it disarms after 5 seconds
      S.leaveArm = true; mainView();
      setTimeout(() => { if (S.leaveArm){ S.leaveArm = false; if (S.view === 'settings' && S.team) mainView(); } }, 5000);
      return;
    }
    S.leaveArm = false;
    try{ await run(sb.rpc('leave_team')); S.view = 'home'; await load(); }
    catch(err){ console.error(err); alert(friendly(err)); mainView(); }
    return;
  }
  if (t.dataset.act === 'cmd'){
    S.cmd = !S.cmd; try{ localStorage.setItem('ff_cmd', S.cmd ? '1' : '0'); }catch(err){}
    mainView(); purgeOld(); return;
  }
  if (t.dataset.act === 'fifth-on' || t.dataset.act === 'fifth-off'){
    try{
      await run(sb.from('team_settings').upsert({team_id:S.team.id, setting_key:'fifth_player', setting_value:t.dataset.act === 'fifth-on'}, {onConflict:'team_id,setting_key'}));
      await load();
    }catch(err){ console.error(err); alert(friendly(err)); }
    return;
  }
  if (t.dataset.act === 'logout'){
    if (!t.dataset.arm){   // first tap only arms the button (no popup); it disarms after 5 seconds
      const old = t.textContent; t.dataset.arm = '1'; t.textContent = 'Tap again to confirm: Log out';
      t.style.color = 'var(--er)'; t.style.borderColor = 'var(--er)';
      setTimeout(() => { if (t.isConnected){ delete t.dataset.arm; t.textContent = old; t.style.color = ''; t.style.borderColor = ''; } }, 5000);
      return;
    }
    unsub(); try{ await sb.auth.signOut(); }catch(err){ console.error(err); } load(); return;
  }
});

// ---------- daily scores (missing = never 0; self-ratings are not counted) ----------
const today = () => { try { return new Date().toLocaleDateString('en-CA', {timeZone: (S.team && S.team.timezone) || undefined}); } catch (e) { return new Date().toLocaleDateString('en-CA'); } };
const fmtDay = d => new Date(d + 'T00:00:00Z').toLocaleDateString(undefined, {day:'numeric', month:'short', timeZone:'UTC'});
const tgtChip = pid => { const t = ((S.ov && S.ov.targets) || []).find(x => x.player_id === pid); return t ? '<span class="tgt">🎯 ' + esc(t.target) + '</span>' : ''; };
function dayStats(pid){   // newest first: {date, n, avg} — anonymous averages computed by the database
  return ((S.ov && S.ov.days) || []).filter(d => d.player_id === pid).map(d => ({date:d.score_date, n:d.n, avg:Number(d.avg)}));
}
function scoreLine(pid){
  const s = dayStats(pid); if (!s.length) return 'No score yet';
  const c = s[0], d = s[1] ? c.avg - s[1].avg : null;
  return c.avg.toFixed(1) + '/50 · ' + c.n + ' rating' + (c.n > 1 ? 's' : '') + (d === null ? '' : ' · ' + (d >= 0 ? '▲ ' : '▼ ') + Math.abs(d).toFixed(1));
}
function teamDay(){
  const per = S.members.filter(m => m.status === 'active' && m.player_number).map(m => dayStats(m.user_id)[0]).filter(Boolean);
  if (!per.length) return null;
  const date = per.map(x => x.date).sort().reverse()[0], same = per.filter(x => x.date === date);
  return {date, n:same.length, avg:same.reduce((a, x) => a + x.avg, 0) / same.length};
}

  ${CATS.map(k => `<label>${CAT_LBL[k]} (0–10)<select name="${k}">${opts}</select></label>`).join('')}
  <label>Note for the player (optional)<input name="notes" maxlength="500"></label>
  <label>Improvement target (optional)<input name="goal" maxlength="200"></label>
  <p class="mut" style="font-size:13px;margin-bottom:10px">The player sees your note without your name.</p>

}
function scoreTotal(f){
  const v = CATS.map(k => f[k].value), n = v.filter(x => x !== '').length;
  const t = v.reduce((a, x) => a + (x === '' ? 0 : +x), 0);
  document.getElementById('sc-total').textContent = n === 5 ? 'Total: ' + t + ' / 50 (' + (t * 2) + '%)' : 'Incomplete: ' + n + ' of 5 filled';
}
function prefillScore(){   // load my existing rating for this date + player, if any
  const f = document.querySelector('form[data-f="saveScore"]'); if (!f || !f.player.value) return;
  const r = S.scores.find(x => x.evaluator_id === S.uid && x.score_date === f.date.value && x.player_id === f.player.value);
  CATS.forEach(k => { f[k].value = r && r[k] != null ? r[k] : ''; });
  f.notes.value = (r && r.notes) || ''; f.goal.value = (r && r.improvement_target) || '';
  scoreTotal(f);
}
document.addEventListener('input', e => { if (e.target.closest('form[data-f="saveScore"],form[data-f="saveTeamRating"]')) S.dirty = true; });
document.addEventListener('change', e => {
  const f = e.target.closest('form[data-f="saveScore"]'); if (!f) return;
  if (e.target.name === 'date' || e.target.name === 'player') prefillScore(); else scoreTotal(f);
});

// ---------- owner tools (Command Mode only) ----------
const prevDay = d => new Date(Date.parse(d + 'T00:00:00Z') - 864e5).toISOString().slice(0, 10);
function missingFor(day){   // per active player: how many of the other players they rated on that day
  const act = S.members.filter(m => m.status === 'active' && m.player_number);
  return act.map(m => {
    const others = act.filter(x => x.user_id !== m.user_id);
    const done = others.filter(x => S.scores.some(r => r.score_date === day && r.evaluator_id === m.user_id && r.player_id === x.user_id && r.total != null)).length;
    return {name:(S.names[m.user_id] || {}).display_name || 'Player', done, need:others.length};
  });
}
function checkHTML(){
  const t = today(), y = prevDay(t);
  const st = x => x.done >= x.need ? '✅ Complete' : x.done === 0 ? '❌ Nothing rated' : '⚠️ ' + x.done + ' of ' + x.need;
  const blk = (label, day) => `<h3 style="margin-top:12px">${label} · ${fmtDay(day)}</h3><ul>${missingFor(day).map(x => `<li><span>${esc(x.name)}</span><small>${st(x)}</small></li>`).join('')}</ul>`;
  const old = [...new Set(S.scores.map(r => r.score_date))].filter(d => d < y).sort().reverse();
  const olderRows = old.map(d => { const bad = missingFor(d).filter(x => x.done < x.need);
    return `<li><span>${fmtDay(d)}</span><small>${bad.length ? '⚠️ ' + bad.map(x => esc(x.name) + ' ' + x.done + '/' + x.need).join(', ') : '✅ All complete'}</small></li>`; }).join('');
  const more = !old.length ? '' : S.more.check ? `<ul style="margin-top:8px">${olderRows}</ul><button class="more" data-more="check">Show less ▴</button>` : `<button class="more" data-more="check">More ▾ · ${old.length} older days</button>`;
  let info = ''; try{ info = localStorage.getItem('ff_purge_info') || ''; }catch(e){}
  return `<div class="card"><h3>📋 Daily Check</h3><small>Who has rated the other players. Visible only in Command Mode.</small>${blk('Today', t)}${blk('Yesterday', y)}${more}
  <p class="mut" style="font-size:13px;margin-top:12px">🧹 Ratings older than 90 days are removed automatically when the owner opens the app.${info ? ' Last cleanup: ' + esc(info) + '.' : ''}</p></div>`;
}
async function purgeOld(){   // keeps 90 days of detailed ratings; at most once a day, owner + Command Mode only
  if (!cmdOn() || !S.team) return;
  const k = 'ff_purge', d = today();
  try{ if (localStorage.getItem(k) === d) return; }catch(e){}
  const cut = new Date(Date.now() - 90 * 864e5).toISOString().slice(0, 10);
  try{
    const gone = await run(sb.from('daily_scores').delete().eq('team_id', S.team.id).lt('score_date', cut).select('id'));
    localStorage.setItem(k, d); localStorage.setItem('ff_purge_info', fmtDay(d) + ' · removed ' + gone.length);
  }catch(e){ console.error(e); }
}

// ---------- "More" lists: newest 2 days by default, everything (up to 90 days) on tap ----------
function limitDays(rows, key){
  const days = [...new Set(rows.map(r => r.score_date))].sort().reverse();
  const keep = S.more[key] ? days : days.slice(0, 2);
  const shown = rows.filter(r => keep.includes(r.score_date));
  return {shown, hidden: rows.length - shown.length};
}
const moreBtn = (key, hidden) => S.more[key] ? `<button class="more" data-more="${key}">Show less ▴</button>` : hidden ? `<button class="more" data-more="${key}">More ▾ · ${hidden} older</button>` : '';

// ---------- leave / delete team, backup and restore ----------
const bkSay = (t, c) => { const m = document.getElementById('bk-msg') || document.getElementById('own-msg'); if (m){ m.className = 'msg ' + c; m.textContent = t; } };
function leaveHTML(){
  if (!isOwner()) return `<button class="btn ghost" data-act="leave" style="margin-top:12px;${S.leaveArm ? 'color:var(--er);border-color:var(--er)' : ''}">${S.leaveArm ? 'Tap again to confirm: Leave Team' : 'Leave Team'}</button>`;
  if (!S.ownLeave) return '<button class="btn ghost" data-act="own-ask" style="margin-top:12px">Leave Team</button>';
  const others = S.members.filter(m => m.user_id !== S.uid && m.status === 'active');
  if (others.length) return `<div class="card" style="margin-top:12px"><h3>Leave as owner</h3><p class="mut" style="margin-bottom:10px">Choose who becomes the new owner. Then you leave and your slot becomes free.</p>
    <label>New owner<select id="new-owner">${others.map(m => `<option value="${m.user_id}">${m.player_number ? 'P' + m.player_number + ' · ' : ''}${esc((S.names[m.user_id] || {}).display_name || 'Player')}</option>`).join('')}</select></label>
    <div class="msg" id="own-msg" role="alert"></div><button class="btn danger" data-act="own-do">Transfer ownership &amp; leave</button>
    <button class="btn ghost" style="margin-top:10px" data-act="own-cancel">Cancel</button></div>`;
  return `<div class="card" style="margin-top:12px"><h3>⚠️ Delete team?</h3><p class="mut" style="margin-bottom:10px">You are the only member. Leaving deletes <b>${esc(S.team.team_name)}</b> and ALL its data from the server: ratings, settings and members. This cannot be undone.</p>
    <button class="btn ghost" data-act="bk-dl">💾 Download backup first</button><div class="msg" id="own-msg" role="alert" style="margin-top:10px"></div>
    <button class="btn danger" data-act="own-do">${S.ownArm ? 'Tap again to DELETE everything' : 'Delete team &amp; leave'}</button>
    <button class="btn ghost" style="margin-top:10px" data-act="own-cancel">Cancel</button></div>`;
}
function backupHTML(){
  return `<div class="card"><h3>💾 Backup &amp; Restore</h3><small>Download all team data as a file and restore it later. Restore only adds saved ratings back; it never deletes or changes anything.</small>
  <div class="msg" id="bk-msg" role="alert" style="margin-top:10px"></div>
  <button class="btn" data-act="bk-dl">Download backup</button><button class="btn ghost" style="margin-top:10px" data-act="bk-pick">Restore from backup file</button>
  <input type="file" id="bk-file" accept=".json,application/json" hidden></div>`;
}
async function downloadBackup(){
  try{
    const tid = S.team.id;
    const [ds, tr, st] = await Promise.all([
      run(sb.from('daily_scores').select('score_date,player_id,evaluator_id,communication,coordination,decision_making,role_execution,map_awareness,notes,improvement_target').eq('team_id', tid)),
      run(sb.from('team_ratings').select('*').eq('team_id', tid)),
      run(sb.from('team_settings').select('setting_key,setting_value').eq('team_id', tid))]);
    const data = {app:'ff-squad', format:1, exported_at:new Date().toISOString(),
      team:{name:S.team.team_name, description:S.team.team_description, timezone:S.team.timezone},
      members:S.members.map(m => ({user_id:m.user_id, name:(S.names[m.user_id] || {}).display_name || '', player_number:m.player_number, status:m.status})),
      settings:st, daily_scores:ds, team_ratings:tr.map(({id, team_id, total, created_at, updated_at, ...r}) => r)};
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:'application/json'}));
    a.download = 'ff-squad-backup-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove();
    bkSay('Backup saved to your phone: ' + ds.length + ' daily ratings, ' + tr.length + ' team ratings.', 'ok');
  }catch(err){ console.error(err); bkSay(friendly(err), 'er'); }
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'bk-file' || !e.target.files[0]) return;
  try{
    const data = JSON.parse(await e.target.files[0].text());
    if (data.app !== 'ff-squad' || !Array.isArray(data.daily_scores)) bad('This is not an FF SQUAD backup file.');
    bkSay('Restoring…', 'ok');
    const r = await run(sb.rpc('restore_backup', {p_team:S.team.id, p_data:{daily_scores:data.daily_scores, team_ratings:data.team_ratings || [], settings:data.settings || []}}));
    await load(); bkSay('Restored: ' + r.daily_scores + ' daily ratings and ' + r.team_ratings + ' team ratings added.', 'ok');
  }catch(err){ console.error(err); bkSay(friendly(err), 'er'); }
  e.target.value = '';
});

// ---------- nickname intro: asked once, the choice (save or skip) is remembered on this phone ----------
const nickKey = () => 'ff_nick_' + S.uid;
const nickDone = () => { try{ return S.nickSeen || localStorage.getItem(nickKey()) === '1'; }catch(e){ return !!S.nickSeen; } };
const setNickDone = () => { S.nickSeen = true; try{ localStorage.setItem(nickKey(), '1'); }catch(e){} if (sb) sb.auth.updateUser({data:{nick_intro:true}}).catch(() => {}); };
const needsNick = () => S.members.some(m => m.status === 'active' && m.user_id !== S.uid) && !nickDone();

// ---------- weekly Team Rating (9 categories x 0-10 = /90; the week is automatic: Monday to Sunday) ----------
const TCATS = [['communication_quality','Communication Quality'],['team_coordination','Team Coordination'],['igl_decision_making','IGL Decision Making'],['rotation_management','Rotation Management'],['role_consistency','Role Consistency'],['map_adaptation','Map Adaptation'],['match_consistency','Match Consistency'],['survival_decisions','Team Survival Decisions'],['replay_improvement','Replay Improvement']];
const weekStart = d => { const t = new Date(d + 'T00:00:00Z'); return new Date(t - ((t.getUTCDay() + 6) % 7) * 864e5).toISOString().slice(0, 10); };
const band = t => t >= 81 ? 'Strong performance' : t >= 63 ? 'Improvement needed' : t >= 45 ? 'Significant weaknesses' : 'Major improvement required';
const weakest = a => { const e = Object.entries(a || {}).filter(([, v]) => v != null).sort((x, y) => x[1] - y[1])[0]; const c = e && TCATS.find(x => x[0] === e[0]); return c ? c[1] : ''; };
function teamEvalText(){
  const w = S.trSum.filter(x => x.n > 0).sort((a, b) => b.week_start.localeCompare(a.week_start))[0];
  return w ? Number(w.avg_total).toFixed(1) + ' / 90 · ' + band(Math.round(w.avg_total)) : 'No Data Available';
}
const scoreTabsHTML = () => `<div class="seg"><button data-act="stab" data-k="player" class="${S.scoreTab !== 'team' ? 'on' : ''}">Player Score</button><button data-act="stab" data-k="team" class="${S.scoreTab === 'team' ? 'on' : ''}">Team Rating</button></div>`;
function teamRatingHTML(){
  const fl = S.flash || ''; S.flash = '';
  const nm = id => (S.names[id] || {}).display_name || 'Player';
  const opts = '<option value="">—</option>' + Array.from({length:11}, (_, i) => `<option value="${i}">${i}</option>`).join('');
  const weeks = S.trSum.filter(x => x.n > 0).sort((a, b) => b.week_start.localeCompare(a.week_start));
  const wl = weeks.slice(0, S.more.trw ? 12 : 3).map((w, i) => { const pv = weeks[i + 1], d = pv ? Number(w.avg_total) - Number(pv.avg_total) : null, wk = weakest(w.avgs);
    return `<li class="lg"><div class="fl"><b>Week of ${fmtDay(w.week_start)}</b><small>${w.n} rating${w.n > 1 ? 's' : ''} · ${band(Math.round(w.avg_total))}${wk ? ' · weakest: ' + esc(wk) : ''}</small>${w.next_focus ? `<span class="note">🎯 ${esc(w.next_focus)}</span>` : ''}</div><small>${Number(w.avg_total).toFixed(1)}/90${d === null ? '' : (d >= 0 ? ' ▲' : ' ▼') + Math.abs(d).toFixed(1)}</small></li>`; }).join('');
  const moreB = weeks.length > 3 || S.more.trw ? `<button class="btn ghost" style="margin-top:10px" data-act="more" data-more="trw">${S.more.trw ? 'Show less' : 'More (' + (weeks.length - 3) + ' older weeks)'}</button>` : '';
  const li = (r, who) => `<li class="lg"><div class="fl"><b>Week of ${fmtDay(r.week_start)}</b>${who ? `<small>by ${esc(nm(r.evaluator_id))}</small>` : ''}${r.notes_worked ? `<span class="note">✅ ${esc(r.notes_worked)}</span>` : ''}${r.notes_wrong ? `<span class="note">⚠️ ${esc(r.notes_wrong)}</span>` : ''}${r.next_focus ? `<span class="note">🎯 ${esc(r.next_focus)}</span>` : ''}</div><small>${r.total != null ? r.total + '/90' : 'Incomplete'}</small></li>`;
  const mine = S.trRows.filter(r => r.evaluator_id === S.uid).slice(0, 4).map(r => li(r, false)).join('');
  const all = S.trRows.slice(0, 10).map(r => li(r, true)).join('');
  return `<h2>Team Rating</h2>${fl ? `<p class="msg ok">${esc(fl)}</p>` : ''}
  <div class="card"><form data-f="saveTeamRating" novalidate>
  <p class="mut" style="margin-bottom:12px">📅 Week of ${fmtDay(weekStart(today()))} <small>(the week is automatic)</small></p>
  ${TCATS.map(([k, l]) => `<label>${l} (0–10)<select name="${k}">${opts}</select></label>`).join('')}
  <label>What worked (optional)<input name="worked" maxlength="500"></label>
  <label>What went wrong (optional)<input name="wrong" maxlength="500"></label>
  <label>Next practice focus (optional)<input name="focus" maxlength="300"></label>
  <p id="tr-total" class="mut" style="margin-bottom:10px">Incomplete: 0 of 9 filled</p>
  <div class="msg" role="alert"></div><button class="btn">Save Team Rating</button></form></div>
  <h2>📊 Team averages</h2><div class="card"><small>Average of everyone's ratings. Names are never shown here.</small><ul>${wl || '<li class="lg"><span class="mut">No team ratings yet.</span></li>'}</ul>${moreB}</div>
  <h2>📤 Sent by you</h2><div class="card"><ul>${mine || '<li class="lg"><span class="mut">You have not rated the team yet.</span></li>'}</ul></div>
  ${cmdOn() ? `<h2>⚡ All Team Ratings <small>(Command Mode)</small></h2><div class="card"><ul>${all || '<li class="lg"><span class="mut">No ratings yet.</span></li>'}</ul></div>` : ''}`;
}
function teamTotal(f){
  const v = TCATS.map(([k]) => f[k].value), n = v.filter(x => x !== '').length, t = v.reduce((a, x) => a + (x === '' ? 0 : +x), 0);
  document.getElementById('tr-total').textContent = n === 9 ? 'Total: ' + t + ' / 90 (' + Math.round(t / 0.9) + '%) · ' + band(t) : 'Incomplete: ' + n + ' of 9 filled';
}
function prefillTeam(){   // my existing rating for this week, if any
  const f = document.querySelector('form[data-f="saveTeamRating"]'); if (!f) return;
  const r = S.trRows.find(x => x.evaluator_id === S.uid && x.week_start === weekStart(today()));
  TCATS.forEach(([k]) => { f[k].value = r && r[k] != null ? r[k] : ''; });
  f.worked.value = (r && r.notes_worked) || ''; f.wrong.value = (r && r.notes_wrong) || ''; f.focus.value = (r && r.next_focus) || '';
  teamTotal(f);
}
document.addEventListener('change', e => { const f = e.target.closest('form[data-f="saveTeamRating"]'); if (f) teamTotal(f); });

// ---------- start ----------
async function boot(){
  if (!CONFIG.SUPABASE_URL.includes('.supabase.co') || CONFIG.SUPABASE_ANON_KEY.length < 20)
    return setupView('Backend Not Configured', 'Open the file, find CONFIG near the top of the script, and paste your Supabase URL and publishable key.');
  if (!window.supabase) return setupView('Could not load Supabase', 'Check your internet connection and reload the page.');
  sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {auth:{flowType:'implicit'}});
  S.recovery = LINK_RECOVERY;
  try{ S.cmd = localStorage.getItem('ff_cmd') === '1'; }catch(e){}
  if (LINK_ERR){ S.linkMsg = 'This reset link is invalid or has expired. Tap "Forgot password?", send a new link and open only the newest email.'; history.replaceState(null, '', location.pathname); }
  // listener is registered BEFORE any await, so the PASSWORD_RECOVERY event is never missed
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ev === 'INITIAL_SESSION') return;
    if (ev === 'PASSWORD_RECOVERY'){ S.recovery = true; return recoverView(); }
    const id = ses && ses.user ? ses.user.id : null;
    if (ev === 'SIGNED_OUT' || id !== S.uid){ S.uid = id; setTimeout(load, 0); }
  });
  const {data:{session}} = await sb.auth.getSession();
  S.uid = session ? session.user.id : null;
  window.addEventListener('offline', () => setSync('off'));
  window.addEventListener('online', load);
  load();
}
boot();
</script>
</body>
</html>
